<!-- 

1. Favicon: El atributo 'type' del favicon no debe contener una ruta. Debe ser el tipo MIME correspondiente. Corrige así:
   <link rel="icon" type="image/png" href="./img/logo.png">

2. Encabezados: Ya que estás usando un <h1> como título principal (lo cual está bien), asegúrate de que no haya más <h1> en otras páginas del sitio si no corresponde.

3. Saltos de línea <br>: Es mejor evitar usar <br> dentro de listas <ul> para separar ítems. Si deseas espacio entre enlaces, puedes manejarlo con CSS o márgenes.

4. Indentación: Intenta mantener una indentación consistente para que el código sea más legible y fácil de editar.

5. Accesibilidad: Bien hecho incluyendo los atributos alt en las imágenes. Continúa haciéndolo en todo el sitio.

6. Buen uso de etiquetas semánticas como <header>, <main>, <nav> y <footer>. Le da estructura lógica al contenido y mejora la accesibilidad.
-->
